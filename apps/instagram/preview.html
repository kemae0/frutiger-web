<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instagram theme preview</title>
<link rel="stylesheet" href="preview.css"><link rel="stylesheet" href="theme-frutiger.css"><link rel="stylesheet" href="theme-dorfic.css"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="../../wallpaper.css"><link rel="stylesheet" href="../../fonts/local.css"><link rel="stylesheet" href="../../fonts.css">
<script defer src="preview.js"></script><script defer src="../../tools/browser-checks.js"></script></head>
<body><nav data-testid="ig-nav"><h1>Instagram</h1><a href="https://www.instagram.com/" aria-current="page">Home</a><a href="https://www.instagram.com/explore/">Search</a><a href="https://www.instagram.com/reels/">Reels</a><a href="https://www.instagram.com/direct/inbox/">Messages</a><a href="https://www.instagram.com/accounts/edit/">Profile</a>
<select id="preview-theme" aria-label="Preview theme"><option value="frutiger">Frutiger Aero</option><option value="dorfic">DORFic</option><option value="off">Off</option></select></nav>
<main><article data-testid="ig-post"><header><span class="avatar"></span><div><strong><span data-testid="ig-title">kemae</span></strong><p data-testid="ig-byline" class="muted">Original audio · 2h</p></div><button aria-label="More options">···</button></header><div class="post-photo" role="img" aria-label="Lake and blue sky illustration"><div class="sun"></div></div><div class="post-details"><div class="actions"><button aria-label="Like">♡</button><button aria-label="Comment">◎</button><button aria-label="Share">↗</button><button aria-label="Save">▱</button></div><p><strong>128 likes</strong></p><p><strong>kemae</strong> By the water</p><p class="muted">View all 12 comments</p><p data-testid="ig-comment"><strong>jules</strong> Beautiful sky!</p><input data-testid="ig-input" placeholder="Add a comment…" aria-label="Add a comment"></div></article>
<article class="reel"><div class="reel-media"><div class="reel-copy"><span data-testid="ig-reel-text">kemae · Follow</span><p>Original audio</p></div><button class="reel-like" aria-label="Like">♡</button></div></article></main>
<aside><section role="dialog" aria-label="Post options" data-testid="ig-dialog"><p data-testid="ig-dialog-text">Post options</p><button>Copy link</button><button>Cancel</button></section><form data-testid="ig-login"><h2>Instagram</h2><label>Username<input name="email" autocomplete="username" placeholder="Phone number, username, or email"></label><label>Password<input name="pass" type="password" autocomplete="current-password" placeholder="Password"></label><div role="button" tabindex="0" class="modern-login" data-testid="ig-modern-login">Log in</div></form></aside></body></html>
